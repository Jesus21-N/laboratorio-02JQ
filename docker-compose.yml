version: '3.8'

services:
  api1:
    container_name: clever_montalcini
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
    networks:
      - app-network

  api2:
    container_name: condescending_davinci
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    networks:
      - app-network

  api3:
    container_name: api_extra_3
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
    networks:
      - app-network

  db:
    image: postgres:latest
    container_name: some-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge